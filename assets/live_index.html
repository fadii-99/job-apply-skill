<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Apply Live</title>
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #f0eee8; --text: #1d1d1b; --muted: #5c5a55;
    --border: #dedbd2; --accent: #b4532a; --ok: #2f7a4b; --ok-soft: #e1f0e6; --warn: #9a6a00;
    --warn-soft: #f7ecd2; --bad: #a83232; --bad-soft: #f6dddd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171716; --surface: #201f1e; --surface-2: #2a2927; --text: #ecebe7; --muted: #a9a69f;
      --border: #3a3936; --accent: #e08a62; --ok: #7cc495; --ok-soft: #1f3226; --warn: #e0b85a;
      --warn-soft: #352d1a; --bad: #e48686; --bad-soft: #3a2222;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .run { font-size: 0.9rem; color: var(--muted); }
  .run b { color: var(--ok); }
  h2 { font-size: 1rem; margin: 28px 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .n { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 0.82rem; color: var(--muted); }
  .workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .w { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .w .id { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .w .job { font-weight: 600; margin: 4px 0 2px; }
  .w .meta { font-size: 0.85rem; color: var(--muted); }
  .stage { display: inline-block; margin-top: 8px; font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .stage.applied { background: var(--ok-soft); color: var(--ok); }
  .stage.manual, .stage.login_needed { background: var(--warn-soft); color: var(--warn); }
  .stage.discarded { background: var(--bad-soft); color: var(--bad); }
  .tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface-2); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.t { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .empty { color: var(--muted); padding: 14px; }
  .stale { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Apply Live</h1>
    <div class="run" id="run">Waiting for data…</div>
  </header>
  <h2>Today</h2>
  <div class="stats" id="stats"></div>
  <h2>Workers</h2>
  <div class="workers" id="workers"></div>
  <h2>Manual list: finish these by hand</h2>
  <div class="tw"><table id="manual"></table></div>
  <h2>Activity</h2>
  <div class="tw"><table id="recent"></table></div>
</div>
<script>
  var LABEL = { searching: "Searching", tailoring: "Tailoring resume", filling: "Filling form", checking: "Checking answers",
    submitting: "Submitting", applied: "Applied", manual: "Sent to manual list", discarded: "Discarded",
    login_needed: "Login needed", idle: "Idle", run_started: "Run started", run_finished: "Run finished" };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function time(ts) { try { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); } catch (e) { return ""; } }
  function render(d) {
    var run = document.getElementById("run");
    run.innerHTML = d.running ? "<b>Running</b> since " + esc(time(d.run_started_at)) + " · updated " + esc(time(d.updated_at))
                              : "Not running · last update " + esc(time(d.updated_at));
    var s = d.stats || {}, by = s.today_by_status || {};
    var tiles = [["Applied today", by.applied || 0], ["Left today", s.left_today], ["In queue", s.queued],
                 ["Manual (total)", s.manual_total], ["Discarded today", by.discarded || 0], ["Skipped today", by.skipped || 0]];
    document.getElementById("stats").innerHTML = tiles.map(function (t) {
      return '<div class="stat"><div class="n">' + esc(t[1] == null ? "–" : t[1]) + '</div><div class="l">' + esc(t[0]) + "</div></div>"; }).join("");
    var w = d.workers || [];
    document.getElementById("workers").innerHTML = w.length ? w.map(function (e) {
      return '<div class="w"><div class="id">' + esc(e.worker) + (e.platform ? " · " + esc(e.platform) : "") + '</div><div class="job">' +
        esc(e.title || "—") + '</div><div class="meta">' + esc(e.company) + (e.job ? " · " + esc(e.job) : "") +
        (e.note ? " · " + esc(e.note) : "") + '</div><span class="stage ' + esc(e.stage) + '">' + esc(LABEL[e.stage] || e.stage) +
        " · " + esc(time(e.at)) + "</span></div>"; }).join("") : '<div class="empty">No workers running.</div>';
    var m = d.manual || [];
    document.getElementById("manual").innerHTML = m.length ? "<tr><th>Code</th><th>Job</th><th>Why</th><th>Link</th></tr>" + m.map(function (r) {
      return "<tr><td>" + esc(r.id) + "</td><td>" + esc(r.title) + " · " + esc(r.company) + " (" + esc(r.platform) + ")</td><td>" +
        esc(r.reason) + '</td><td><a href="' + esc(r.canonical_url) + '" target="_blank" rel="noopener">Open</a></td></tr>'; }).join("")
      : '<tr><td class="empty">Nothing waiting for you.</td></tr>';
    var r = d.recent || [];
    document.getElementById("recent").innerHTML = r.length ? r.map(function (e) {
      return '<tr><td class="t">' + esc(time(e.at)) + "</td><td>" + esc(e.worker) + "</td><td>" + esc(LABEL[e.stage] || e.stage) +
        "</td><td>" + esc([e.job, e.title, e.company].filter(Boolean).join(" · ")) + (e.note ? " — " + esc(e.note) : "") + "</td></tr>"; }).join("")
      : '<tr><td class="empty">No activity yet.</td></tr>';
  }
  function load() {
    var old = document.getElementById("livejs"); if (old) old.remove();
    var s = document.createElement("script"); s.id = "livejs"; s.src = "live.js?t=" + Date.now();
    s.onload = function () { if (window.__LIVE) render(window.__LIVE); };
    document.body.appendChild(s);
  }
  load(); setInterval(load, 2000);
</script>
</body>
</html>
