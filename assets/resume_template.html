<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* One-column, real-text layout: every word is selectable text in reading order, so ATS parsers read it.
     Nothing is absolutely positioned (that changes text order in the PDF), and the bundled TrueType font
     (Arimo, Helvetica metrics) embeds as TrueType, not Type 3, which some ATS parsers can't read. */
  @font-face { font-family: "ResumeSans"; src: url("{{FONT_DIR}}/Arimo-Regular.ttf"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "ResumeSans"; src: url("{{FONT_DIR}}/Arimo-Bold.ttf"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "ResumeSans"; src: url("{{FONT_DIR}}/Arimo-Italic.ttf"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "ResumeSans"; src: url("{{FONT_DIR}}/Arimo-BoldItalic.ttf"); font-weight: 700; font-style: italic; }
  @page { size: letter; margin: 0.4in 0.5in 0.45in; }
  :root {
    --text: #1f2937;   /* body and names */
    --muted: #475569;  /* companies, dates, descriptions */
    --blue: #1e3a8a;   /* headline, section titles, links */
    --rule: #cbd5e1;   /* thin rules under section titles */
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0; color: var(--text);
    font-family: "ResumeSans", Arimo, Arial, Helvetica, "Liberation Sans", sans-serif;
    font-size: 9.9pt; line-height: 1.24;
  }
  a { color: inherit; text-decoration: none; }

  header { text-align: center; padding-bottom: 9pt; border-bottom: 1.4pt solid var(--blue); margin-bottom: 12pt; }
  h1 { font-size: 19.5pt; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: 0.005em; }
  .headline { color: var(--blue); font-weight: 700; font-size: 10.6pt; margin: 2pt 0 6pt; }
  .contact { display: flex; justify-content: space-between; column-gap: 8pt; row-gap: 2pt; font-size: 8.8pt; flex-wrap: wrap; }
  .contact .m { color: var(--muted); }

  h2 {
    color: var(--blue); font-size: 10.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em;
    margin: 11pt 0 7pt; padding-bottom: 6.5pt; border-bottom: 0.6pt solid var(--rule);
    break-after: avoid;
  }
  section:first-of-type h2 { margin-top: 2pt; }
  p.summary { margin: 0; }

  .item { margin: 0 0 8.5pt; break-inside: avoid; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
  .row .lead b { font-weight: 700; }
  .row .lead .m { color: var(--muted); }
  .dates { color: var(--muted); font-weight: 700; font-size: 9.4pt; white-space: nowrap; }
  .desc { color: var(--muted); font-style: italic; font-size: 9.4pt; margin: 0.5pt 0 1pt; }

  ul { list-style: none; margin: 2pt 0 0; padding: 0; }
  li { padding-left: 11pt; text-indent: -7.5pt; margin: 0 0 2.2pt; }
  li::before { content: "•"; display: inline-block; width: 7.5pt; text-indent: 0; font-size: 0.75em; vertical-align: 0.08em; }

  .stack-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt;
               padding-left: 11pt; font-size: 9.2pt; margin-top: 0.5pt; }
  .stack-row b { font-weight: 700; }
  .stack-row .items { color: var(--muted); }
  .stack-row .link { color: var(--blue); white-space: nowrap; }
  .link svg { width: 7.5pt; height: 7.5pt; vertical-align: -0.5pt; margin-left: 2.5pt; }

  .skills { display: grid; grid-template-columns: max-content 1fr; column-gap: 16pt; row-gap: 1.6pt; font-size: 9.2pt; margin: 0; }
  .skills dt { font-weight: 700; margin: 0; }
  .skills dd { margin: 0; }

  .edu .inst { margin-top: 0.5pt; }
  .cert { margin: 0 0 2.6pt; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
